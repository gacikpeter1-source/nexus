<!doctype html>
<html lang="sk" translate="no">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Prevent browser auto-translate — translation wraps text nodes in <font> elements
         which breaks React's DOM reconciliation (removeChild crash on Android Chrome) -->
    <meta name="google" content="notranslate" />

    <!-- Primary Meta Tags -->
    <meta name="description" content="Nexus - Club & Team Management Application" />
    <meta name="theme-color" content="#0A0E27" />
    <title>Nexus - Club Management</title>
    
    <!-- Favicons -->
    <link rel="icon" type="image/x-icon" href="/favicon.ico?v=3" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg?v=3" />
    <link rel="icon" type="image/png" sizes="96x96" href="/favicon-96x96.png?v=3" />
    
    <!-- Apple Touch Icon -->
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png?v=3" />

    <!-- iOS standalone app behavior — required for "Add to Home Screen" (via Safari)
         to hide browser chrome and run as a real full-screen app rather than a
         bookmark that reopens inside the browser. -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Nexus" />

    <!-- Web App Manifest -->
    <link rel="manifest" href="/site.webmanifest" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
